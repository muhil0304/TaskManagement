<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskManagement</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>TaskManagement</h1>
        <p class="subtitle">Simple task management made easy</p>
      </header>

      <main>
        <div class="add-task-section">
          <input type="text" id="taskInput" placeholder="Enter a new task..." />
          <button id="addTaskBtn" class="btn-primary">Add Task</button>
        </div>

        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="task-stats">
          <span id="taskCount">0 tasks</span>
          <button id="clearCompleted" class="btn-secondary">Clear Completed</button>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>

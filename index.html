<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Task Manager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-section">
                <i class="fa-solid fa-clipboard-list logo-icon"></i>
                <h1>TaskFlow</h1>
            </div>
            
            <!-- Search and Filter Controls -->
            <div class="controls-section">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search tasks...">
                </div>
                
                <div class="filter-box">
                    <i class="fa-solid fa-filter filter-icon"></i>
                    <select id="priority-filter">
                        <option value="all">All Priorities</option>
                        <option value="high">High Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="low">Low Priority</option>
                    </select>
                </div>

                <button id="add-task-btn" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Add Task
                </button>
            </div>
        </header>

        <!-- Kanban Board -->
        <main class="kanban-board">
            <!-- To Do Column -->
            <div class="kanban-column" id="todo-column" data-status="todo">
                <div class="column-header">
                    <div class="column-title-wrapper">
                        <span class="column-dot todo-dot"></span>
                        <h2>To Do</h2>
                        <span class="task-count" id="todo-count">0</span>
                    </div>
                </div>
                <div class="task-list" id="todo-list">
                    <!-- Tasks will be injected here -->
                </div>
            </div>

            <!-- In Progress Column -->
            <div class="kanban-column" id="inprogress-column" data-status="inprogress">
                <div class="column-header">
                    <div class="column-title-wrapper">
                        <span class="column-dot inprogress-dot"></span>
                        <h2>In Progress</h2>
                        <span class="task-count" id="inprogress-count">0</span>
                    </div>
                </div>
                <div class="task-list" id="inprogress-list">
                    <!-- Tasks will be injected here -->
                </div>
            </div>

            <!-- Done Column -->
            <div class="kanban-column" id="done-column" data-status="done">
                <div class="column-header">
                    <div class="column-title-wrapper">
                        <span class="column-dot done-dot"></span>
                        <h2>Done</h2>
                        <span class="task-count" id="done-count">0</span>
                    </div>
                </div>
                <div class="task-list" id="done-list">
                    <!-- Tasks will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Task Modal (Add / Edit) -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add New Task</h3>
                <button class="close-modal-btn" id="close-modal-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id">
                
                <div class="form-group">
                    <label for="task-title">Title <span class="required">*</span></label>
                    <input type="text" id="task-title" required placeholder="Enter task title" maxlength="50">
                </div>

                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Enter task description" maxlength="250"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="task-due-date">Due Date</label>
                        <input type="date" id="task-due-date">
                    </div>
                </div>

                <div class="form-group">
                    <label for="task-status">Status</label>
                    <select id="task-status">
                        <option value="todo">To Do</option>
                        <option value="inprogress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-task-btn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
